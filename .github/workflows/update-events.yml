name: Update events
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    paths: ["manual-events.json"]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/update-events.mjs
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          LOCATION: ${{ vars.LOCATION }}
      - name: Commit changes
        run: |
          git config user.name "events-bot"
          git config user.email "events-bot@users.noreply.github.com"
          git add events.json
          git diff --staged --quiet || (git commit -m "Update events" && git push)
